<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#315c78"><title>家庭學習刷題站</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark">✦</span><div><strong>家庭學習刷題站</strong><small>每天一點點，累積大進步</small></div></div><div class="top-actions"><span id="today"></span><button class="ghost" id="resetData">重設本機資料</button></div></header>
<main class="wrap">
<section class="welcome"><div><p class="eyebrow">LEARN · PRACTICE · GROW</p><h1>今天想挑戰哪一科？</h1><p>選擇學生、年級與科目，開始你的每日練習。</p></div><div class="welcome-art">✎<span>✦</span></div></section>
<section class="toolbar card"><div class="field"><label for="student">學習學生</label><select id="student"><option value="學生 A">學生 A</option><option value="學生 B">學生 B</option></select></div><div class="field"><label for="grade">年級</label><select id="grade"><option value="G5">國小五年級</option><option value="G6">國小六年級</option><option value="J1">國中一年級</option><option value="J2">國中二年級</option><option value="J3">國中三年級</option></select></div><div class="field"><label for="subject">科目</label><select id="subject"></select></div><div class="field"><label for="count">本次題數</label><select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div><button class="primary" id="start">開始刷題 <span>→</span></button></section>
<section class="stats" id="stats"></section>
<section class="content-grid"><section class="card practice" id="practice"><div class="empty-state"><div class="empty-icon">✦</div><h2>準備好開始了嗎？</h2><p>選好年級與科目，按下「開始刷題」開始挑戰。</p></div></section>
<aside class="side-col"><section class="card"><div class="section-head"><h3>📚 科目與版本</h3></div><div id="versionInfo" class="version-list"></div></section><section class="card"><div class="section-head"><h3>⭐ 我的學習紀錄</h3><span class="muted" id="recordStudent"></span></div><div id="recordSummary"></div></section></aside></section>
<section class="card wrong-section"><div class="section-head"><div><h2>錯題本</h2><p class="muted">答錯的題目會自動收錄在這裡</p></div><button class="outline" id="reviewWrong">開始複習</button></div><div id="wrongList" class="wrong-list"><p class="muted">目前還沒有錯題，繼續保持！</p></div></section>
<footer>題目為原創練習示例，依年級與學科能力設計，非南一、康軒或翰林課本原題。學習紀錄儲存在目前裝置的瀏覽器中。</footer>
</main><script src="app.js"></script></body></html>
